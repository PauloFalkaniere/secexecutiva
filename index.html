<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secretaria Executiva</title>
<!--
  Política de segurança de conteúdo (CSP): limita de onde o navegador
  aceita carregar scripts, estilos, imagens e para onde a página pode
  enviar dados (apenas o Supabase). Reduz o estrago de uma eventual
  injeção de código. Todo o JavaScript fica em arquivos .js deste
  repositório, então scripts embutidos no HTML são proibidos ('self').
  O GitHub Pages não permite cabeçalhos HTTP próprios, por isso ela vai
  aqui como <meta>.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; frame-src blob:; worker-src 'self' blob:; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!--
  Configuração do banco de dados (Supabase): fica em config.js, um
  arquivo separado deste (veja o README.md para o passo a passo). Assim,
  quando você atualizar este index.html para uma versão nova do sistema,
  suas chaves em config.js não são substituídas. Se config.js não
  existir (como na pré-visualização do artefato), o sistema funciona
  normalmente no modo local (dados salvos só neste navegador, sem login).
-->
<script src="config.js"></script>
<!-- Bibliotecas guardadas no próprio repositório (pasta vendor/): o site
     não depende de CDN externo e as versões não mudam sozinhas. -->
<script src="vendor/supabase.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
