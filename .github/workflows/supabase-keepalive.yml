# Mantém o projeto gratuito do Supabase ativo.
# Projetos gratuitos são pausados após 1 semana sem uso. Esta tarefa chama,
# duas vezes por semana, a função public.keepalive() — que só devolve a hora
# atual e não lê nenhum dado. A URL e a chave "anon" (pública) vêm do config.js.
# Também pode ser rodada à mão em: Actions → Supabase keepalive → Run workflow.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 13 * * 1,4"   # segundas e quintas, 10h17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Chamar keepalive()
        run: |
          URL=$(grep -oE 'SECEX_SUPABASE_URL *= *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SECEX_SUPABASE_ANON_KEY *= *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js sem URL/chave do Supabase"; exit 1; fi
          for tentativa in 1 2 3; do
            STATUS=$(curl -s -o resposta.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keepalive" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Tentativa $tentativa: HTTP $STATUS — $(cat resposta.txt)"
            [ "$STATUS" = "200" ] && exit 0
            sleep 30
          done
          echo "O Supabase não respondeu. Se o projeto foi pausado, reative em supabase.com."
          exit 1
